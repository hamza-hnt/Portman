name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true
      - name: Formatting and shell syntax
        run: |
          test -z "$(gofmt -l cmd internal)"
          for script in install.sh scripts/*.sh; do sh -n "$script"; done
      - run: go vet ./...
      - name: Unit and real-process integration tests
        run: go test -race -count=1 ./...
      - name: Build release archive
        run: make package
      - name: Test installation with and without Go
        run: python3 scripts/test-install.py
      - name: Install packaged binary for TUI test
        shell: bash
        run: |
          archive=$(find dist -name '*.tar.gz' -print -quit)
          ./install.sh --archive "$archive" --prefix "$RUNNER_TEMP/portman"
      - name: Exercise installed TUI and safe termination in a pseudo-terminal
        run: python3 scripts/smoke-tui.py "$RUNNER_TEMP/portman/bin/portman"
      - name: Exercise Docker Compose grouping and isolated container termination
        if: matrix.os == 'ubuntu-24.04'
        run: |
          docker pull python:3.13.7-alpine
          python3 scripts/smoke-docker.py "$RUNNER_TEMP/portman/bin/portman"
      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: portman-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish tested release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Require tag to match VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - uses: actions/download-artifact@v4
        with:
          pattern: portman-*
          path: dist
          merge-multiple: true
      - name: Publish archives, checksums and installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "Portman $RELEASE_TAG" install.sh dist/*.tar.gz dist/*.sha256
